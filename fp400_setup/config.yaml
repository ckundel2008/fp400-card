name: FP400 Controller
version: "0.2.1"
slug: fp400_setup
description: Dauerhafter Zusatzcontroller für FP400-Zonen und Live-Positionen
url: https://github.com/ckundel2008/fp400-card
arch:
  - amd64
  - aarch64
homeassistant: "2026.9.0"
stage: stable
startup: services
boot: auto
init: false
timeout: 60
host_network: true
ingress: true
ingress_port: 0
panel_icon: mdi:radar
panel_title: FP400 Controller
panel_admin: true
map:
  - type: homeassistant_config
    read_only: false
options:
  network_interface: ""
  migration_mode: none
schema:
  network_interface: str
  migration_mode: list(none|export|import)
